<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily Sharpie</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sharpie Routine">
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/000000/ball-point-pen.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden; /* Stops whole-screen rubber-band bounce */
      background-color: #FFFFFF;
      color: #0d0d0d;
      font-family: 'Patrick Hand', cursive, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 520px;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 4px 16px 0 16px;
      overflow: hidden;
    }

    /* Auth Screen Modal */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .auth-box {
      width: 100%;
      max-width: 330px;
      border: 3px solid #0d0d0d;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .auth-box h2 {
      margin: 0 0 4px 0;
      font-size: 28px;
      text-transform: uppercase;
    }

    .auth-box p {
      margin: 0 0 14px 0;
      color: #666;
      font-size: 16px;
    }

    .auth-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 2px solid #0d0d0d;
      border-radius: 8px;
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      outline: none;
      color: #0d0d0d;
      background: #fff;
    }

    .auth-btn {
      width: 100%;
      background: #0d0d0d;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-family: 'Patrick Hand', cursive;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-toggle-btn {
      background: transparent;
      border: none;
      padding: 8px;
      margin-top: 10px;
      color: #0d0d0d;
      text-decoration: underline;
      cursor: pointer;
      font-family: 'Patrick Hand', cursive;
      font-size: 17px;
      display: block;
      width: 100%;
      text-align: center;
    }

    /* List Selector Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 6px;
    }

    .list-select-wrapper {
      position: relative;
      flex: 1;
    }

    select.list-picker {
      width: 100%;
      padding: 6px 24px 6px 10px;
      font-family: 'Patrick Hand', cursive;
      font-size: 17px;
      font-weight: bold;
      color: #0d0d0d;
      background: #FFFFFF;
      border: 2px solid #0d0d0d;
      border-radius: 8px;
      appearance: none;
      outline: none;
    }

    .select-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 11px;
    }

    .btn-secondary {
      background: #f0f0f0;
      border: 2px solid #0d0d0d;
      border-radius: 8px;
      font-family: 'Patrick Hand', cursive;
      font-size: 14px;
      font-weight: bold;
      padding: 5px 8px;
      cursor: pointer;
    }

    /* Main Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 6px;
      border-bottom: 3px solid #0d0d0d;
    }

    .title-area h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title-area .status {
      font-size: 14px;
      color: #666;
      margin-top: 3px;
    }

    .btn-reset {
      background: #0d0d0d;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 6px 12px;
      font-family: 'Patrick Hand', cursive;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s;
    }

    .btn-reset:disabled {
      opacity: 0.25;
      cursor: default;
    }

    /* Task List (Only this section scrolls if tasks overflow) */
    .task-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      list-style: none;
      padding: 8px 0;
      margin: 0;
    }

    .task-row {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: #FFFFFF;
      border: 2px solid rgba(13,13,13,0.15);
      border-radius: 10px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .task-row.highlighted {
      border: 2px solid #0d0d0d;
      background-color: rgba(0,0,0,0.03);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border: 2.5px solid #0d0d0d;
      border-radius: 5px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 20px;
      line-height: 1.1;
      word-break: break-word;
    }

    .task-text.completed {
      color: #777;
      text-decoration: line-through 2.5px #0d0d0d;
    }

    .delete-btn {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 50%;
      background: #D91E1E;
      color: #FFFFFF;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      margin-left: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #888;
      font-size: 19px;
    }

    /* Bottom Input */
    .bottom-bar {
      border-top: 2px solid rgba(13,13,13,0.2);
      padding: 8px 0;
      display: flex;
      gap: 8px;
      background: #FFFFFF;
    }

    .task-input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #0d0d0d;
      border-radius: 8px;
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      outline: none;
      color: #0d0d0d;
      background: #fff;
    }

    .btn-add {
      background: #0d0d0d;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      width: 44px;
      height: 44px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Auth Screen Modal -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-box">
      <h2 id="authTitle">Sign In</h2>
      <p id="authSubtitle">Access your private routine lists</p>
      <input type="email" id="authEmail" class="auth-input" placeholder="Your email address" autocomplete="email">
      <input type="password" id="authPassword" class="auth-input" placeholder="Password (min 6 chars)">
      <button type="button" id="authSubmitBtn" class="auth-btn" onclick="handleAuthSubmit()">SIGN IN</button>
      <button type="button" id="authToggleBtn" class="auth-toggle-btn" onclick="toggleAuthMode()">Don't have an account? Sign up</button>
    </div>
  </div>

  <div class="container">
    <!-- List Selector & Actions -->
    <div class="toolbar">
      <div class="list-select-wrapper">
        <select id="listPicker" class="list-picker" onchange="switchList(this.value)"></select>
        <span class="select-arrow">▼</span>
      </div>
      <button class="btn-secondary" onclick="promptNewList()">+ New</button>
      <button class="btn-secondary" onclick="deleteCurrentList()">🗑</button>
      <button class="btn-secondary" onclick="logOut()">Sign Out</button>
    </div>

    <!-- Header Section -->
    <div class="header">
      <div class="title-area">
        <h1 id="listHeading">Daily Routine</h1>
        <div id="statusCounter" class="status">0 OF 0 COMPLETED</div>
      </div>
      <button id="resetBtn" class="btn-reset" onclick="resetRoutine()" disabled>
        ↺ RESET
      </button>
    </div>

    <!-- Items List -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Bottom Input -->
    <div class="bottom-bar">
      <input type="text" id="taskInput" class="task-input" placeholder="Add daily task..." onkeydown="handleInputKey(event)">
      <button class="btn-add" onclick="addTask()">+</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // SUPABASE CREDENTIALS
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://clpygxcsliofrzhcrmzi.supabase.co";
    // Replace with your eyJ... key from Supabase > Settings > API Keys > Legacy anon
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNscHlneGNzbGlvZnJ6aGNybXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTQ0MzMsImV4cCI6MjEwNjE5MDQzM30.pwfnNDU2XPjrUYkTXFk0CCUCmUwJfAulTEpuQqmy5GQ";
    // -------------------------------------------------------------

    // Global state variables
    let supabaseClient = null;
    let currentUser = null;
    let lists = [];
    let items = [];
    let activeListId = null;
    let highlightedItemId = null;
    let isSignUpMode = false;

    // 1. Auth toggle defined first so buttons work unconditionally
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      const titleEl = document.getElementById('authTitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('authToggleBtn');

      if (isSignUpMode) {
        titleEl.innerText = "Create Account";
        submitBtn.innerText = "SIGN UP";
        toggleBtn.innerText = "Already have an account? Sign in";
      } else {
        titleEl.innerText = "Sign In";
        submitBtn.innerText = "SIGN IN";
        toggleBtn.innerText = "Don't have an account? Sign up";
      }
    }

    // 2. Auth submission
    async function handleAuthSubmit() {
      if (!supabaseClient) {
        alert("Database connection is not ready. Please verify your Supabase anon key.");
        return;
      }
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert("Please enter both an email and password.");
        return;
      }

      if (isSignUpMode) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          alert(error.message);
        } else {
          alert("Account created successfully! Signing you in...");
          checkSession();
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          alert(error.message);
        } else {
          checkSession();
        }
      }
    }

    async function logOut() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      currentUser = null;
      document.getElementById('authScreen').style.display = 'flex';
    }

    async function checkSession() {
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        document.getElementById('authScreen').style.display = 'none';
        await loadUserData();
      } else {
        document.getElementById('authScreen').style.display = 'flex';
      }
    }

    // 3. User Data Handling
    async function loadUserData() {
      if (!supabaseClient) return;

      const { data: userLists, error: listErr } = await supabaseClient
        .from('lists')
        .select('*')
        .order('created_at', { ascending: true });

      if (listErr) {
        console.error("Error loading lists:", listErr);
        return;
      }

      if (!userLists || userLists.length === 0) {
        const { data: newList } = await supabaseClient
          .from('lists')
          .insert({ name: 'Morning Routine' })
          .select()
          .single();
        lists = newList ? [newList] : [];
      } else {
        lists = userLists;
      }

      if (!activeListId || !lists.find(l => l.id === activeListId)) {
        activeListId = lists[0]?.id;
      }

      if (activeListId) {
        const { data: userItems } = await supabaseClient
          .from('items')
          .select('*')
          .eq('list_id', activeListId)
          .order('order_index', { ascending: true });
        items = userItems || [];
      }
      render();
    }

    function render() {
      const currentList = lists.find(l => l.id === activeListId) || lists[0];
      if (!currentList) return;
      activeListId = currentList.id;

      document.getElementById('listHeading').innerText = currentList.name;

      const picker = document.getElementById('listPicker');
      picker.innerHTML = '';
      lists.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.innerText = l.name.toUpperCase();
        opt.selected = (l.id === activeListId);
        picker.appendChild(opt);
      });

      const completedCount = items.filter(i => i.completed).length;
      document.getElementById('statusCounter').innerText = `${completedCount} OF ${items.length} COMPLETED`;
      document.getElementById('resetBtn').disabled = (completedCount === 0);

      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No tasks in this routine.<br>Write one below!</div>';
        return;
      }

      items.forEach(item => {
        const li = document.createElement('li');
        const isHighlighted = (highlightedItemId === item.id);
        li.className = `task-row ${isHighlighted ? 'highlighted' : ''}`;

        const box = document.createElement('div');
        box.className = 'checkbox';
        box.innerHTML = item.completed ? '✓' : '';
        box.onclick = async (e) => {
          e.stopPropagation();
          item.completed = !item.completed;
          render();
          await supabaseClient.from('items').update({ completed: item.completed }).eq('id', item.id);
        };

        const text = document.createElement('div');
        text.className = `task-text ${item.completed ? 'completed' : ''}`;
        text.innerText = item.title;

        li.appendChild(box);
        li.appendChild(text);

        li.onclick = () => {
          highlightedItemId = isHighlighted ? null : item.id;
          render();
        };

        if (isHighlighted) {
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerText = '✕';
          delBtn.onclick = async (e) => {
            e.stopPropagation();
            items = items.filter(i => i.id !== item.id);
            highlightedItemId = null;
            render();
            await supabaseClient.from('items').delete().eq('id', item.id);
          };
          li.appendChild(delBtn);
        }

        listEl.appendChild(li);
      });
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const val = input.value.trim();
      if (!val || !activeListId) return;

      const { data: newItem } = await supabaseClient
        .from('items')
        .insert({
          list_id: activeListId,
          title: val,
          completed: false,
          order_index: items.length
        })
        .select()
        .single();

      if (newItem) {
        items.push(newItem);
        input.value = '';
        render();
      }
    }

    function handleInputKey(e) {
      if (e.key === 'Enter') addTask();
    }

    async function resetRoutine() {
      items.forEach(i => i.completed = false);
      render();
      await supabaseClient.from('items').update({ completed: false }).eq('list_id', activeListId);
    }

    async function switchList(id) {
      activeListId = id;
      highlightedItemId = null;
      const { data: userItems } = await supabaseClient
        .from('items')
        .select('*')
        .eq('list_id', activeListId)
        .order('order_index', { ascending: true });
      items = userItems || [];
      render();
    }

    async function promptNewList() {
      const name = prompt('Name for new routine:');
      if (name && name.trim()) {
        const { data: newList } = await supabaseClient
          .from('lists')
          .insert({ name: name.trim() })
          .select()
          .single();
        if (newList) {
          lists.push(newList);
          await switchList(newList.id);
        }
      }
    }

    async function deleteCurrentList() {
      if (lists.length <= 1) {
        alert("You must keep at least one list.");
        return;
      }
      if (confirm(`Delete the current list?`)) {
        await supabaseClient.from('lists').delete().eq('id', activeListId);
        lists = lists.filter(l => l.id !== activeListId);
        await switchList(lists[0].id);
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.task-row')) {
        if (highlightedItemId !== null) {
          highlightedItemId = null;
          render();
        }
      }
    });

    // 4. Safely initialize client and check auth session on load
    try {
      if (window.supabase && SUPABASE_ANON_KEY !== "PASTE_YOUR_LEGACY_ANON_KEY_HERE") {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        checkSession();
      }
    } catch (e) {
      console.error("Initialization error:", e);
    }
  </script>
</body>
</html>
